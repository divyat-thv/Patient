<!DOCTYPE html>
<html>

<head>

  <title>Register</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>

    body{
      font-family:Arial;
      padding:40px;
      max-width:400px;
      margin:auto;
    }

    input{
      width:100%;
      padding:12px;
      margin-bottom:12px;
    }

    button{
      width:100%;
      padding:12px;
      cursor:pointer;
    }

    .msg{
      margin-top:10px;
      color:red;
    }

  </style>

</head>

<body style="opacity:0">

<h2>Create Account</h2>

<form id="regForm">

  <input type="text" id="name" placeholder="Full Name" required>

  <input type="email" id="email" placeholder="Email" required>

  <input type="text" id="phone" placeholder="Phone">

  <input type="text" id="clinic" placeholder="Clinic">

  <input type="text" id="city" placeholder="City">

  <input type="text" id="specialisation" placeholder="Specialisation">

  <input type="password" id="password" placeholder="Password" required>

  <button type="submit">
    Register
  </button>

</form>

<div class="msg" id="msg"></div>

<p>
  Already have account?
  <a href="login.html">Login</a>
</p>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="js/firebase-config.js"></script>

<script src="js/auth.js"></script>

<script>

Auth.requireGuest();

document.getElementById("regForm")
.addEventListener("submit", async (e) => {

  e.preventDefault();

  const result =
    await Auth.registerUser({

      name:
        document.getElementById("name").value,

      email:
        document.getElementById("email").value,

      password:
        document.getElementById("password").value,

      phone:
        document.getElementById("phone").value,

      clinic:
        document.getElementById("clinic").value,

      city:
        document.getElementById("city").value,

      specialisation:
        document.getElementById("specialisation").value
    });

  if(result.ok){

    window.location.href = "login.html";

  }else{

    document.getElementById("msg")
      .innerText = result.error;
  }

});

</script>

</body>
</html>
